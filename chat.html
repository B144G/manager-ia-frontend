<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Discuter avec nous</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#4f46e5">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@700;800&display=swap">
<link rel="stylesheet" href="assets/chat.css">
</head>
<body>
<main class="chat" id="app">
  <header class="top"><div class="av" id="av" aria-hidden="true">?</div><div><h1 id="org">Assistant</h1><p id="sub">Assistant commercial · répond tout de suite</p></div></header>
  <div class="log" id="log" aria-live="polite"></div>
  <p class="off" id="off" hidden></p>
  <form class="bar" id="form" autocomplete="off">
    <button type="button" class="mic" id="mic" hidden aria-label="Parler (message vocal)" title="Parler"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a3 3 0 00-3 3v6a3 3 0 006 0V6a3 3 0 00-3-3zM6 11a6 6 0 0012 0M12 17v4M9 21h6"/></svg></button>
    <textarea id="msg" rows="1" maxlength="1000" placeholder="Écrivez votre message…" aria-label="Votre message"></textarea>
    <button class="send" id="send" type="submit" aria-label="Envoyer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l16-8-6 16-3-7z"/></svg></button>
  </form>
  <p class="note" id="note">Vos informations (nom, téléphone) servent uniquement à traiter votre demande. Ne donnez jamais de mot de passe ni de code secret.</p>
</main>
<script src="config.js"></script>
<script src="assets/chat.js"></script>
</body>
</html>
