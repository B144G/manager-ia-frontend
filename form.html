<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nous écrire</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/ws.css">
</head>
<body class="ws">
<div class="ws-center">
  <div class="ws-card narrow">
    <h1>Nous écrire</h1>
    <p class="muted">Décrivez votre demande : l'équipe vous répond le plus vite possible.</p>
    <form class="ws-form" id="f" novalidate>
      <label class="fld"><span>Votre nom</span><input id="name" autocomplete="name" required></label>
      <label class="fld"><span>Votre téléphone ou e-mail</span><input id="contact" autocomplete="off"></label>
      <label class="fld"><span>Sujet</span><input id="subject"></label>
      <label class="fld"><span>Votre message</span><textarea id="message" rows="5" required></textarea></label>
      <p class="ws-err" id="err" role="alert"></p>
      <button class="btn primary" type="submit" id="go">Envoyer</button>
    </form>
    <p id="ok" class="ok" hidden>Merci ! Votre message a bien été envoyé. Nous revenons vers vous très vite.</p>
  </div>
</div>
<script src="config.js"></script>
<script>
(function () {
  var token = new URLSearchParams(location.search).get("o") || "";
  var cfg = window.MI_CONFIG || {}, f = document.getElementById("f"), err = document.getElementById("err");
  if (typeof cfg.API_BASE !== "string") err.textContent = "Ce formulaire n'est pas encore branché au serveur.";
  f.addEventListener("submit", function (e) {
    e.preventDefault();
    err.textContent = "";
    var v = function (id) { return document.getElementById(id).value.trim(); };
    if (!v("name") || !v("message")) { err.textContent = "Indiquez votre nom et votre message."; return; }
    var b = document.getElementById("go"); b.disabled = true;
    fetch((cfg.API_BASE || "") + "/api/ws/public/intake/" + encodeURIComponent(token), { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name: v("name"), contact: v("contact"), subject: v("subject"), message: v("message") }) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) throw new Error(j.error || "Envoi impossible, réessayez."); }); })
      .then(function () { f.hidden = true; document.getElementById("ok").hidden = false; })
      .catch(function (e) { err.textContent = e.message; b.disabled = false; });
  });
})();
</script>
</body>
</html>
