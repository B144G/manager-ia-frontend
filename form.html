<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nous écrire</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/home.css">
<link rel="stylesheet" href="assets/site.css">
<link rel="stylesheet" href="assets/auth-plus.css">
</head>
<body class="site au">
<div class="au-main" style="min-height:100vh">
  <a class="s-logo au-logo" style="display:flex" href="index.html" aria-label="MANAGER-IA, accueil"><i>MI</i><span>MANAGER<b>-IA</b></span></a>
  <div class="au-card">
    <h1>Nous écrire</h1>
    <p class="au-sub">Décrivez votre demande : l'équipe vous répond le plus vite possible.</p>
    <form id="f" novalidate>
      <label class="fld"><span>Votre nom</span><input id="name" autocomplete="name" required></label>
      <label class="fld"><span>Votre téléphone ou e-mail</span><input id="contact" autocomplete="off"></label>
      <label class="fld"><span>Sujet</span><input id="subject"></label>
      <label class="fld"><span>Votre message</span><textarea id="message" rows="5" required></textarea></label>
      <p class="hm-err" id="err" role="alert"></p>
      <button class="s-btn pri big au-go" type="submit" id="go">Envoyer</button>
    </form>
    <p id="ok" class="s-ok" hidden>Merci ! Votre message a bien été envoyé. Nous revenons vers vous très vite.</p>
  </div>
</div>
<script src="config.js"></script>
<script src="assets/form.js"></script>
</body>
</html>
