<rect x="24" y="72" width="592" height="326" rx="10" fill="#16264a" /><text x="44" y="102" fill="#e8eef8" font-size="14" font-weight="800" text-anchor="start">Procédure : accueil et encaissement d'un client</text><rect x="44" y="124" width="552" height="42" rx="10" fill="#1d315c" /><circle cx="70" cy="145" r="13" fill="#4cd39b"/><text x="70" y="150" fill="#0b1322" font-size="13" font-weight="800" text-anchor="middle">✓</text><text x="94" y="150" fill="#e8eef8" font-size="13" font-weight="600" text-anchor="start">Saluer le client et écouter son besoin</text><rect x="44" y="176" width="552" height="42" rx="10" fill="#1d315c" /><circle cx="70" cy="197" r="13" fill="#4cd39b"/><text x="70" y="202" fill="#0b1322" font-size="13" font-weight="800" text-anchor="middle">✓</text><text x="94" y="202" fill="#e8eef8" font-size="13" font-weight="600" text-anchor="start">Proposer les produits adaptés</text><rect x="44" y="228" width="552" height="42" rx="10" fill="#1d315c" /><circle cx="70" cy="249" r="13" fill="#4cd39b"/><text x="70" y="254" fill="#0b1322" font-size="13" font-weight="800" text-anchor="middle">✓</text><text x="94" y="254" fill="#e8eef8" font-size="13" font-weight="600" text-anchor="start">Confirmer le prix et le moyen de paiement</text><rect x="44" y="280" width="552" height="42" rx="10" fill="#1d315c" /><circle cx="70" cy="301" r="13" fill="#2a4380"/><text x="70" y="306" fill="#e8eef8" font-size="13" font-weight="800" text-anchor="middle">4</text><text x="94" y="306" fill="#8fa3c4" font-size="13" font-weight="600" text-anchor="start">Encaisser et remettre le reçu</text><rect x="44" y="332" width="552" height="42" rx="10" fill="#1d315c" /><circle cx="70" cy="353" r="13" fill="#2a4380"/><text x="70" y="358" fill="#e8eef8" font-size="13" font-weight="800" text-anchor="middle">5</text><text x="94" y="358" fill="#8fa3c4" font-size="13" font-weight="600" text-anchor="start">Noter la vente dans le budget</text></svg>