<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="Conversation avec l'assistant intégré au site qui guide l'utilisateur" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<defs><radialGradient id="g" cx="85%" cy="0%" r="90%"><stop offset="0" stop-color="#6f9bff" stop-opacity=".28"/><stop offset="1" stop-color="#6f9bff" stop-opacity="0"/></radialGradient></defs>
<rect width="640" height="420" rx="22" fill="#0b1322"/><rect width="640" height="420" rx="22" fill="url(#g)"/>
<circle cx="30" cy="28" r="6" fill="#f07aa3"/><circle cx="50" cy="28" r="6" fill="#f5b730"/><circle cx="70" cy="28" r="6" fill="#4cd39b"/>
<text x="100" y="33" fill="#8fa3c4" font-size="14" font-weight="600">Assistant IA intégré</text>
<line x1="0" y1="52" x2="640" y2="52" stroke="#1d315c"/>
<rect x="24" y="72" width="592" height="326" rx="10" fill="#16264a" /><circle cx="60" cy="104" r="16" fill="#6f9bff"/><text x="60" y="110" fill="#0b1322" font-size="13" font-weight="800" text-anchor="middle">IA</text><text x="88" y="100" fill="#e8eef8" font-size="14" font-weight="800" text-anchor="start">Assistant MANAGER-IA</text><text x="88" y="118" fill="#4cd39b" font-size="12" font-weight="600" text-anchor="start">Disponible partout sur le site</text><rect x="300" y="140" width="300" height="40" rx="14" fill="#1d315c" /><text x="314" y="165" fill="#e8eef8" font-size="13" font-weight="500" text-anchor="start">Comment créer mon organisation ?</text><rect x="40" y="194" width="410" height="92" rx="14" fill="#6f9bff" /><text x="56" y="220" fill="#0b1322" font-size="13" font-weight="600" text-anchor="start">1. Créez votre compte et choisissez</text><text x="56" y="240" fill="#0b1322" font-size="13" font-weight="600" text-anchor="start">« Gestion d'activité ».</text><text x="56" y="260" fill="#0b1322" font-size="13" font-weight="600" text-anchor="start">2. Donnez un nom à votre organisation.</text><rect x="300" y="300" width="300" height="40" rx="14" fill="#1d315c" /><text x="314" y="325" fill="#e8eef8" font-size="13" font-weight="500" text-anchor="start">Merci, et pour inviter mon équipe ?</text><rect x="40" y="352" width="556" height="34" rx="17" fill="#0e1a30" /><text x="58" y="374" fill="#8fa3c4" font-size="13" font-weight="500" text-anchor="start">Posez votre question…</text></svg>