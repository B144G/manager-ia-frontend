<rect x="24" y="70" width="592" height="64" rx="10" fill="#16264a" /><text x="44" y="96" fill="#8fa3c4" font-size="12" font-weight="500" text-anchor="start">Articles</text><text x="44" y="122" fill="#e8eef8" font-size="20" font-weight="800" text-anchor="start">4</text><text x="190" y="96" fill="#8fa3c4" font-size="12" font-weight="500" text-anchor="start">Sous le seuil</text><text x="190" y="122" fill="#f5b730" font-size="20" font-weight="800" text-anchor="start">1</text><text x="340" y="96" fill="#8fa3c4" font-size="12" font-weight="500" text-anchor="start">En rupture</text><text x="340" y="122" fill="#f07aa3" font-size="20" font-weight="800" text-anchor="start">1</text><text x="470" y="96" fill="#8fa3c4" font-size="12" font-weight="500" text-anchor="start">Valeur du stock</text><text x="470" y="122" fill="#6f9bff" font-size="16" font-weight="800" text-anchor="start">281 500 FCFA</text><rect x="24" y="148" width="352" height="252" rx="10" fill="#16264a" /><text x="40" y="174" fill="#e8eef8" font-size="13" font-weight="700" text-anchor="start">Articles</text><line x1="40" y1="190" x2="360" y2="190" stroke="#1d315c"/><text x="40" y="208" fill="#e8eef8" font-size="13" font-weight="700" text-anchor="start">Huile</text><text x="40" y="226" fill="#8fa3c4" font-size="11" font-weight="500" text-anchor="start">0 litre</text><rect x="262" y="202" width="92" height="20" rx="10" fill="#f07aa3" fill-opacity=".22"/><text x="308.0" y="216" fill="#f07aa3" font-size="11" font-weight="700" text-anchor="middle">Rupture</text><line x1="40" y1="238" x2="360" y2="238" stroke="#1d315c"/><text x="40" y="256" fill="#e8eef8" font-size="13" font-weight="700" text-anchor="start">Savon</text><text x="40" y="274" fill="#8fa3c4" font-size="11" font-weight="500" text-anchor="start">3 pièces · seuil 10</text><rect x="262" y="250" width="92" height="20" rx="10" fill="#f5b730" fill-opacity=".22"/><text x="308.0" y="264" fill="#f5b730" font-size="11" font-weight="700" text-anchor="middle">Sous le seuil</text><line x1="40" y1="286" x2="360" y2="286" stroke="#1d315c"/><text x="40" y="304" fill="#e8eef8" font-size="13" font-weight="700" text-anchor="start">Riz (sac 25 kg)</text><text x="40" y="322" fill="#8fa3c4" font-size="11" font-weight="500" text-anchor="start">14 sacs</text><rect x="262" y="298" width="92" height="20" rx="10" fill="#4cd39b" fill-opacity=".22"/><text x="308.0" y="312" fill="#4cd39b" font-size="11" font-weight="700" text-anchor="middle">OK</text><line x1="40" y1="334" x2="360" y2="334" stroke="#1d315c"/><text x="40" y="352" fill="#e8eef8" font-size="13" font-weight="700" text-anchor="start">Sucre</text><text x="40" y="370" fill="#8fa3c4" font-size="11" font-weight="500" text-anchor="start">40 kg</text><rect x="262" y="346" width="92" height="20" rx="10" fill="#4cd39b" fill-opacity=".22"/><text x="308.0" y="360" fill="#4cd39b" font-size="11" font-weight="700" text-anchor="middle">OK</text><rect x="392" y="148" width="224" height="252" rx="10" fill="#16264a" /><text x="408" y="174" fill="#e8eef8" font-size="13" font-weight="700" text-anchor="start">Commande à valider</text><rect x="408" y="190" width="192" height="92" rx="10" fill="#0f1c38" stroke="#f5b730" stroke-dasharray="4 3"/><text x="420" y="214" fill="#e8eef8" font-size="14" font-weight="800" text-anchor="start">Savon × 17</text><text x="420" y="234" fill="#8fa3c4" font-size="11" font-weight="500" text-anchor="start">Grossiste Nord · 400 FCFA</text><text x="420" y="254" fill="#4cd39b" font-size="12" font-weight="700" text-anchor="start">Total : 6 800 FCFA</text><text x="420" y="272" fill="#8fa3c4" font-size="10" font-weight="500" text-anchor="start">Meilleur prix et délai</text><rect x="408" y="296" width="92" height="30" rx="8" fill="#4cd39b" /><text x="454" y="316" fill="#06231a" font-size="12" font-weight="800" text-anchor="middle">Valider</text><rect x="508" y="296" width="92" height="30" rx="8" fill="#243a6a" /><text x="554" y="316" fill="#e8eef8" font-size="12" font-weight="600" text-anchor="middle">Annuler</text><text x="408" y="356" fill="#8fa3c4" font-size="11" font-weight="500" text-anchor="start">Stock mis à jour à la réception,</text><text x="408" y="372" fill="#8fa3c4" font-size="11" font-weight="500" text-anchor="start">dépense inscrite au budget.</text></svg>
