<rect x="24" y="70" width="300" height="330" rx="10" fill="#16264a" /><text x="40" y="96" fill="#e8eef8" font-size="13" font-weight="700" text-anchor="start">Conversation avec un prospect</text><text x="40" y="112" fill="#8fa3c4" font-size="11" font-weight="500" text-anchor="start">via la pub Facebook</text><rect x="40" y="126" width="200" height="40" rx="14" fill="#243a6a" /><text x="52" y="144" fill="#e8eef8" font-size="11" font-weight="500" text-anchor="start">Bonjour, cmb la robe wax ?</text><text x="52" y="158" fill="#e8eef8" font-size="11" font-weight="500" text-anchor="start">jé vu votre pub</text><rect x="80" y="176" width="230" height="52" rx="14" fill="#1d4ed8" /><text x="92" y="196" fill="#fff" font-size="11" font-weight="500" text-anchor="start">Bonjour ! La Robe wax Aïcha</text><text x="92" y="212" fill="#fff" font-size="11" font-weight="500" text-anchor="start">coûte 15 000 FCFA.</text><rect x="40" y="238" width="200" height="26" rx="14" fill="#243a6a" /><text x="52" y="255" fill="#e8eef8" font-size="11" font-weight="500" text-anchor="start">Je veux 2 robes, je confirme</text><rect x="80" y="274" width="230" height="52" rx="14" fill="#1d4ed8" /><text x="92" y="294" fill="#fff" font-size="11" font-weight="500" text-anchor="start">Merci Paul, commande C-2026-0001</text><text x="92" y="310" fill="#fff" font-size="11" font-weight="500" text-anchor="start">enregistrée : 30 000 FCFA.</text><rect x="40" y="346" width="150" height="36" rx="18" fill="#16264a" stroke="#4cd39b"/><text x="115" y="369" fill="#4cd39b" font-size="11" font-weight="700" text-anchor="middle">Message vocal transcrit</text><rect x="340" y="70" width="276" height="150" rx="10" fill="#16264a" /><text x="356" y="96" fill="#e8eef8" font-size="13" font-weight="700" text-anchor="start">Nouveau prospect enregistré</text><text x="356" y="122" fill="#e8eef8" font-size="16" font-weight="800" text-anchor="start">Paul Test</text><text x="356" y="142" fill="#8fa3c4" font-size="12" font-weight="500" text-anchor="start">677 11 22 33</text><text x="356" y="162" fill="#f5b730" font-size="12" font-weight="700" text-anchor="start">Campagne : facebook-octobre</text><rect x="356" y="176" width="110" height="24" rx="12" fill="#4cd39b" fill-opacity=".22"/><text x="411" y="192" fill="#4cd39b" font-size="11" font-weight="700" text-anchor="middle">Prospect → Client</text><rect x="340" y="232" width="276" height="168" rx="10" fill="#16264a" /><text x="356" y="258" fill="#e8eef8" font-size="13" font-weight="700" text-anchor="start">Commande à valider</text><text x="356" y="284" fill="#e8eef8" font-size="14" font-weight="800" text-anchor="start">Robe wax Aïcha × 2</text><text x="356" y="304" fill="#4cd39b" font-size="13" font-weight="700" text-anchor="start">Total : 30 000 FCFA</text><rect x="356" y="326" width="110" height="32" rx="8" fill="#4cd39b" /><text x="411" y="347" fill="#06231a" font-size="12" font-weight="800" text-anchor="middle">Confirmer</text><rect x="476" y="326" width="110" height="32" rx="8" fill="#243a6a" /><text x="531" y="347" fill="#e8eef8" font-size="12" font-weight="600" text-anchor="middle">Refuser</text><text x="356" y="386" fill="#8fa3c4" font-size="11" font-weight="500" text-anchor="start">Les prix viennent du catalogue.</text></svg>
