<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="Assistant commercial : un prospect discute, est enregistré et commande" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
