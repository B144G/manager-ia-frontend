<rect width="640" height="420" rx="22" fill="#0b1322"/><rect width="640" height="420" rx="22" fill="url(#g)"/>
<circle cx="30" cy="28" r="6" fill="#f07aa3"/><circle cx="50" cy="28" r="6" fill="#f5b730"/><circle cx="70" cy="28" r="6" fill="#4cd39b"/>
<text x="100" y="33" fill="#8fa3c4" font-size="14" font-weight="600">Assistant commercial</text>
