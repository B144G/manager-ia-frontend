<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hors connexion · Brij-IA</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b1322">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:#0b1322;color:#e8edf7;font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{max-width:420px;text-align:center;background:#111b33;border:1px solid #22305a;border-radius:18px;padding:28px 24px}
  h1{margin:0 0 8px;font-size:1.5rem}p{color:#b8c4dd}
  button{margin-top:8px;border:0;border-radius:12px;padding:12px 20px;background:#4f46e5;color:#fff;font:600 1rem system-ui,sans-serif;cursor:pointer}
</style>
</head>
<body>
<main>
  <h1>Pas de connexion</h1>
  <p>Brij-IA a besoin d'Internet pour afficher et enregistrer vos données en toute sécurité. Vérifiez votre connexion (Wi-Fi ou données mobiles), puis réessayez. Rien n'est perdu.</p>
  <button type="button" id="retry">Réessayer</button>
</main>
<script>document.getElementById('retry').addEventListener('click', function () { location.reload(); });</script>
</body>
</html>
